# Regenerates numbers.json for examples via the measurement harness (SERV-1310).
#
# Requires the FAL_KEY repository secret (ephemeral deploys cost real GPU time,
# so this runs on manual dispatch + a weekly schedule, never on every push).
# After the transfer to fal-ai-community: re-add FAL_KEY and check org Actions policies.

name: numbers

permissions:
  contents: write # the numbers-bot commit push needs this (GITHUB_TOKEN defaults to read-only)

# Never two measurement runs at once: ephemeral deploys cost real money and
# concurrent runs would race the numbers-bot push.
concurrency:
  group: numbers
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      example:
        description: "Path to one example dir (e.g. 00-getting-started/hello-fal). Empty = all examples."
        required: false
        default: ""
  # Enable the weekly schedule after the first successful manual dispatch
  # (needs the FAL_KEY secret and account balance — ephemeral deploys bill real time).
  # schedule:
  #   - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83a49b83e6d5aa9d1a4b8d1908998cba1cc # v6.0.0
        with:
          python-version: "3.11"
      - name: Guard - FAL_KEY present
        run: |
          if [ -z "${{ secrets.FAL_KEY }}" ]; then
            echo "::warning::FAL_KEY secret not set - skipping measurement run"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        id: guard
      - name: Install
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r harness/requirements.txt
      - name: Measure
        if: steps.guard.outputs.skip != 'true'
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          EXAMPLE: ${{ inputs.example }} # via env, never interpolated into the script
        run: python harness/measure.py --example "$EXAMPLE"
      - name: Commit updated numbers
        # Runs even when Measure failed: a partial measure-all run still paid
        # for the numbers it DID produce - commit them, keep the job red.
        if: steps.guard.outputs.skip != 'true' && !cancelled()
        run: |
          git config user.name "numbers-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- ':(glob)**/numbers.json' || true
          git diff --cached --quiet && exit 0
          git commit -m "chore: regenerate numbers.json [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
