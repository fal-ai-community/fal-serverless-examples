# Regenerates numbers.json for examples via the measurement harness (SERV-1310).
# STATUS: stub — becomes active once harness/measure.py is implemented.
#
# Requires the FAL_KEY repository secret (ephemeral deploys cost real GPU time,
# so this runs on manual dispatch + a weekly schedule, never on every push).
# After the transfer to fal-ai-community: re-add FAL_KEY and check org Actions policies.

name: numbers

permissions:
  contents: write # the numbers-bot commit push needs this (GITHUB_TOKEN defaults to read-only)

on:
  workflow_dispatch:
    inputs:
      example:
        description: "Path to one example dir (e.g. 00-getting-started/hello-fal). Empty = all examples."
        required: false
        default: ""
  # Enable the weekly schedule once the harness is implemented (SERV-1310) —
  # until then scheduled runs would burn Actions minutes as green no-ops.
  # schedule:
  #   - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83a49b83e6d5aa9d1a4b8d1908998cba1cc # v6.0.0
        with:
          python-version: "3.11"
      - name: Guard - FAL_KEY present
        run: |
          if [ -z "${{ secrets.FAL_KEY }}" ]; then
            echo "::warning::FAL_KEY secret not set - skipping measurement run"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        id: guard
      - name: Install
        if: steps.guard.outputs.skip != 'true'
        run: pip install fal pytest
      - name: Measure
        if: steps.guard.outputs.skip != 'true'
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: python harness/measure.py --example "${{ inputs.example }}"
      - name: Commit updated numbers
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "numbers-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A "**/numbers.json" || true
          git diff --cached --quiet || git commit -m "chore: regenerate numbers.json [skip ci]"
          git push
