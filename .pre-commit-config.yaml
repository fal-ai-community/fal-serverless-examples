# Strict commit gate; ruff/mypy config lives in pyproject.toml.
# Setup: uv tool install prek && prek install. CI: .github/workflows/lint.yml.

default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        # Bound set by the largest demo asset in the repo (a 2.9 MB viewer gif);
        # model weights and datasets must never be committed.
        args: [--maxkb=3072]
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-vcs-permalinks
      - id: debug-statements
      - id: detect-private-key

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: ["--ignore-regex", ".*#.*codespell: ignore"]

  - repo: local
    hooks:
      # Grouped per example dir: examples share app.py/test_app.py basenames.
      - id: mypy
        name: mypy (grouped per example)
        entry: python tools/run_mypy.py
        language: python
        types: [python]
        require_serial: true
        additional_dependencies:
          - mypy==1.19.1 # newest that coexists with fal's pathspec<1 pin
          - fal==1.78.2 # deps below mirror harness/requirements.txt
          - httpx==0.28.1
          - pytest==9.1.1

      - id: static-check
        name: repo conventions (harness/static_check.py)
        entry: python harness/static_check.py
        language: python
        pass_filenames: false
        files: ^([0-9]{2}-[^/]+/|harness/|conftest\.py)
        additional_dependencies:
          - fal==1.78.2
          - httpx==0.28.1
          - pytest==9.1.1

      - id: catalog-check
        name: llms.txt and tier READMEs list every example
        entry: python tools/check_catalog.py
        language: python
        pass_filenames: false
        files: ^([0-9]{2}-[^/]+/|llms\.txt)
